[project]
name = "create-simli-app-livekit"
version = "0.1.0"
description = "A LiveKit Agents voice agent with a Simli Trinity-2 avatar"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.15"
dependencies = [
    "livekit-agents==1.8.9",
    "livekit-plugins-openai==1.8.9",
    "livekit-plugins-simli==1.8.9",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = ["ruff==0.17.2"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
